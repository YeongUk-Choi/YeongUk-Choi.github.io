<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Rietveld Auto">
  <defs>
    <linearGradient id="ra-line" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c084fc"/>
      <stop offset=".55" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#fb923c"/>
    </linearGradient>
    <linearGradient id="ra-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1f29"/>
      <stop offset="1" stop-color="#0c0d12"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="62" height="62" rx="15" fill="url(#ra-bg)" stroke="rgba(255,255,255,0.14)"/>
  <!-- observed/calculated: one strong reflection and a weaker one -->
  <path d="M8 41 H17 L21.5 14 L26 41 H33.5 L37 26 L40.5 41 H56" fill="none" stroke="url(#ra-line)"
        stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- the difference curve that makes it a Rietveld plot rather than a diffractogram -->
  <path d="M8 51.5 H19 l1.6 -3 l1.8 5 l1.6 -2 H37 l1.4 -2.2 l1.6 3.6 l1.4 -1.4 H56" fill="none"
        stroke="#34d399" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" opacity=".8"/>
</svg>
