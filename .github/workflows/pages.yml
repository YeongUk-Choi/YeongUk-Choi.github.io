# Refreshes publication metadata (Crossref/OpenAlex, by DOI) once a week and commits it to main.
# Deployment itself is handled by GitHub Pages "Deploy from a branch" (main, /) — every push to main republishes the site.
name: refresh-publications
on:
  schedule:
    - cron: "0 18 * * 0"   # Sunday 03:00 KST
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: refresh-publications
  cancel-in-progress: true
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh publication metadata by DOI
        run: python3 scripts/fetch_publications.py
      - name: Commit refreshed list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/publications.js
          if git diff --cached --quiet; then echo "no change"; else git commit -m "chore: refresh publication metadata" && git push; fi
